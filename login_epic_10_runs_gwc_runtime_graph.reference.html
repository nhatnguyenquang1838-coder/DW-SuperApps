<!doctype html><html><head><meta charset='utf-8'/><title>Login Epic Runtime Graph Reference</title><style>body{margin:0;background:#06111e;color:#eef6ff;font-family:system-ui}.app{padding:16px}.run{display:inline-block;width:240px;min-height:120px;margin:8px;padding:12px;border:1px solid #334155;border-radius:14px;background:#142b49;vertical-align:top;cursor:pointer}.run.active{border-color:#f59e0b}.gate{margin:18px 0;padding:12px;border:1px solid #334155;border-radius:16px;background:#0c1c31}.node{display:inline-block;width:220px;min-height:135px;margin:10px;padding:10px;border:1px solid #475569;border-radius:14px;background:#10233c;vertical-align:top}.node.active{border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.12)}button{margin:4px;padding:8px;border-radius:8px;background:#10233c;color:white;border:1px solid #475569}pre{white-space:pre-wrap;background:#020617;padding:12px;border-radius:12px}</style></head><body><div class='app'><h1>Login Capability Epic — 10 GWC Runs</h1><p>Reference HTML. Production UI must use typed source architecture.</p><div id='runs'></div><hr/><div><button onclick='prev()'>Prev</button><button onclick='playPause()' id='play'>Play</button><button onclick='next()'>Next</button><span id='cursor'></span></div><div id='graph'></div><h2>Details</h2><pre id='details'></pre></div><script src='login_epic_10_runs_gwc_taskcontroller_data.json'></script><script>let data=window.EPIC||null,ri=0,ci=0,t=null;if(!data)document.body.insertAdjacentHTML('afterbegin','<b>Load generated JSON first.</b>');function render(){let r=data.runs[ri];runs.innerHTML=data.runs.map((x,i)=>`<div class='run ${i===ri?'active':''}' onclick='ri=${i};ci=0;render()'><b>${x.id}</b><br/>${x.title}<br/>${x.route.length} runtime nodes</div>`).join('');cursor.textContent=`${r.id} node ${ci+1}/${r.route.length}`;let active=r.route[ci];graph.innerHTML=r.gates.map(g=>`<section class='gate'><h2>${g.id} → ${g.nodes.length} nodes</h2>${g.nodes.map(n=>`<article class='node ${n.id===active.node_id?'active':''}' onclick='ci=${r.route.findIndex(z=>z.node_id===n.id)};render()'><b>${n.title}</b><br/><small>${n.id}</small><p>${n.purpose}</p></article>`).join('')}</section>`).join('');let n=r.gates.flatMap(g=>g.nodes).find(n=>n.id===active.node_id);details.textContent=JSON.stringify(n,null,2)}function next(){let r=data.runs[ri];ci=Math.min(r.route.length-1,ci+1);render()}function prev(){ci=Math.max(0,ci-1);render()}function playPause(){if(t){clearInterval(t);t=null;play.textContent='Play';return}play.textContent='Pause';t=setInterval(()=>{let r=data.runs[ri];if(ci>=r.route.length-1){clearInterval(t);t=null;play.textContent='Play';return}ci++;render()},800)}if(data)render()</script></body></html>
