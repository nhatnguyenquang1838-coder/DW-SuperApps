apiVersion: dw.superapps/v2
kind: Power
metadata:
  id: ua
  name: Understand Anything
  version: ua-main-3-4d5fda706fc9683d097cedc947a02011f11baa38
  description: Semantic codebase analysis, architecture discovery, dependency mapping, dashboard visualization, and project knowledge generation.
spec:
  category: knowledge
  path: projects/ua
  source: nhatnguyenquang1838-coder/Understand-Anything
  upstream: Egonex-AI/Understand-Anything
  provides:
    - semantic-analysis
    - codebase-graph
    - architecture-graph
    - dependency-map
    - dashboard
  consumes:
    - source-code
    - project-documents
    - repository-metadata
  requires:
    - filesystem
  optionalIntegrations:
    - github
    - task-me
  runtimeDataRoot: .ua
  hosts:
    - kiro
    - codex
    - copilot
    - cline
    - kilo
    - claude
    - custom
    - cli
  entrypoints:
    skillCandidates:
      - understand-anything-plugin/skills/understand/SKILL.md
      - README.md
    cliCandidates:
      - install.sh
      - install.ps1
  permissions:
    read:
      - "**"
    write:
      - ".ua/**"
    deny:
      - ".env*"
      - "**/secrets/**"
  distribution:
    contract: dw.power-distribution/v1
    defaultMode: power-dist
    modes:
      submodule:
        repository: nhatnguyenquang1838-coder/Understand-Anything
        upstreamRepository: Egonex-AI/Understand-Anything
        path: projects/ua
        ref: main
      release:
        repository: nhatnguyenquang1838-coder/Understand-Anything
        assetPattern: "ua-{version}.zip"
        checksumAssetPattern: "ua-{version}.zip.sha256"
      powerDist:
        repository: nhatnguyenquang1838-coder/Understand-Anything
        ref: power-dist
    providerState:
      status: published
      task: DW-PDIST-04
      sourceCommit: 4d5fda706fc9683d097cedc947a02011f11baa38
      sourceLock: SOURCE.lock.json
      note: Current published power-dist is ua-main-3-4d5fda706fc9683d097cedc947a02011f11baa38. Provider main 36166580700472d88bb80d7f3f1e7f257b8adf7f contains a newer dashboard-package change, so dashboard availability is reported as source-ahead until provider republication.
