[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dw-observation"
version = "0.1.0"
description = "DW Run Observatory — read-only deterministic projection of DW-SuperApps/GWC execution state"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
qualification = [
  "langgraph==1.2.18; python_version >= '3.10'",
  "langgraph-checkpoint-sqlite==3.1.2; python_version >= '3.10'",
]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dw_observation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
