options:
  - id: OPT-1
    title: JSON Schema + Markdown design document approach
    description: >
      Create JSON Schema definitions for runtime events, checkpoints, store API,
      pending actions, and adapter contracts as standalone .json/.yaml files.
      Supplement with Markdown design documents explaining semantics, state machines,
      and migration path. Store all artifacts under .gwc/scrums/SCRUM-105/.
    benefits:
      - Machine-validatable schemas
      - Agent-readable design docs
      - Easy to reference in implementation
      - Compatible with existing .gwc/ workflow
    tradeoffs:
      - Slightly more manual coordination between schemas and docs
    risks:
      - Schemas may drift from docs if not maintained together
    constraintFit: FULL
    skillsDistribution:
      - skillId: task-me
        description: Implementation planning
        isRequired: true
    acceptanceCriteriaCoverage:
      - AC-1 through AC-9
    recommendationRationale: >
      This is the minimal viable approach that stays within existing GWC patterns.
      JSON Schema enables automated validation, while Markdown documents provide
      human-readable context and migration guidance.

  - id: OPT-2
    title: BMAD structured template approach
    description: >
      Use BMAD structured templates for the design, generating YAML-based
      specification with embedded validation rules. Store in .bmad/ instead of .gwc/.
    benefits:
      - Structured output compatible with BMAD tooling
      - Auto-generation of implementation tasks
    tradeoffs:
      - Requires BMAD template configuration
      - Less flexibility for custom schema definitions
      - Departs from .gwc/ convention for this task
    risks:
      - Additional tooling complexity
      - May conflict with SCRUM-104 validator lane patterns
    constraintFit: PARTIAL
    skillsDistribution:
      - skillId: bmad
        description: Structured design workflow
        isRequired: true
    acceptanceCriteriaCoverage:
      - AC-1 through AC-9 (partial)
    recommendationRationale: >
      BMAD is powerful for structured design but introduces unnecessary complexity
      for a knowledge lane design task. The .gwc/ workflow already supports schema
      and doc artifacts without additional tooling.

  - id: OPT-3
    title: GWC core power extension approach
    description: >
      Extend the existing GWC power source (powers/gwc/) with new schema definitions
      and store modules. Create runtime store artifacts within the GWC power package.
    benefits:
      - Schema lives alongside governance infrastructure
      - Consistent with GWC power structure
    tradeoffs:
      - Requires modifying a shared power package
      - Affects all systems using GWC
      - Higher blast radius
    risks:
      - Shared power package changes need coordination
      - May break other system consumers
    constraintFit: LOW
    skillsDistribution:
      - skillId: gwc
        description: GWC governance workflow
        isRequired: true
    acceptanceCriteriaCoverage:
      - AC-1 through AC-9 (partial)
    recommendationRationale: >
      Extending the shared GWC power package creates unnecessary coupling. The
      design should target the rental-home system specifically, not the GWC power
      infrastructure itself. The SCRUM-104 validator lane will consume these schemas
      via the canonical registries, not directly.

recommendedOption: OPT-1
decisionRequired: true
selectionRule:
  1. Prefer the option that reuses current mechanisms (OPT-1 uses existing .gwc/ workflow)
  2. Prefer lower blast radius (OPT-1 adds workspace-owned design artifacts only)
  3. Prefer instruction-level guidance over tool-level change (OPT-1 uses existing JSON Schema and Markdown)
  4. Prefer schema/tool changes only when instruction-only cannot satisfy acceptance criteria (OPT-1 satisfies all ACs)
  5. Reject options that imply G4/G5/G6 or production authority (OPT-1 requires no G4/G5/G6)
  6. SCRUM-105 is a knowledge lane (design) task, not an implementation task — design artifacts only

g1Feasibility: FEASIBLE
