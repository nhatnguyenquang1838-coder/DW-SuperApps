intent:
  statement: >-
    Establish the DWO v2 development baseline: bind DWO to the active Universal Runtime
    release-development line by exact SHA, inventory the existing DWO M0-M4 capability
    surface and every stale/legacy binding, record the compatibility/effect-governance
    baseline separately from native Universal semantics, inventory browser/read/write
    access boundaries (RLS paths, Realtime topics), and define the recurring R0 rebind
    evidence record plus drift-classification taxonomy that every later DWO v2 governed
    run consumes.
  why_now: >-
    SCRUM-821 is the entry work package of SCRUM-820 and blocks SCRUM-822 and SCRUM-823.
    No DWO v2 fixture, projection-contract or reducer work may bind to a Universal source
    identity until the binding registry and drift taxonomy exist.

scope:
  in_scope:
    - Release-binding registry materializing universal_repository / logical_release_development_ref / exact_consumed_sha / lifecycle_profile / contract identity / binding timestamp / affected surfaces.
    - DWO M0-M4 capability inventory with explicit per-surface provenance and staleness classification.
    - Compatibility vs native Universal namespace separation baseline.
    - Access-boundary inventory: browser read paths, server read paths, write/effect paths, RLS policies, Realtime topics.
    - Recurring R0 rebind evidence record schema + drift classification taxonomy.
    - Deterministic tests proving the registry is exact-SHA-pinned and fail-closed on drift.
  out_of_scope:
    - Materializing any DWO-UR-30-V1 fixture (SCRUM-822).
    - Projection Contract v2 implementation (SCRUM-823).
    - Reducer/topology semantics (SCRUM-824).
    - Any repository merge, deploy, production, database-migration or secret effect.
    - Granting G4_MERGE / G5_DEPLOY / G6_PRODUCTION authority.

constraints:
  - No silent fallback from the Universal release-development source to current gwc/main.
  - Exact consumed SHA is mandatory evidence; a moving branch name is never sufficient.
  - DWO projection state (sync_state, source_profile, semantic_qualification) stays a separate namespace from Universal runtime facts.
  - DWO is read-only: no approval/deny/runtime-control surface.
  - Stage by explicit path; never `git add .` (shared checkouts carry other agents' dirt).

