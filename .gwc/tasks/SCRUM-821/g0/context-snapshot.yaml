      main_sha: 414002f92d48083e7133236346b26e3a2a047e33
      main_date: "2026-09-28T14:10:41Z"
    divergence:
      pre_prod_commits_behind: "unresolved (pre-prod last advanced 2026-08-23; pin predates it)"
      main_commits_behind: 181
      compare_status: ahead
    classification: STALE_PINNED_SHA
    detail: >-
      The DWO app profile pins the Universal Runtime to a pre-prod SHA that is 181 commits
      behind current gwc/main and also older than the current pre-prod tip. This is a
      live source-binding defect: the DWO app profile does not identify the active
      Universal release-development line at all. It is app-level metadata only and does
      not repurpose the projects/gwc submodule gitlink, which stays out of scope.
    disposition: >-
      Classified and recorded, not silently overwritten. The R0 registry supersedes this
      ad-hoc app-profile pin as the authoritative DWO v2 source binding; the profile is
      reconciled by a separate explicitly authorized change, not by this package.

  - id: STALE-002
    severity: MEDIUM
    surface: projects/dw-observation/fixtures/**
    declared: >-
      v1 fixture data bound to SCRUM-555 (m0, m5_mock), SCRUM-669 (gwc_durable_m0) and the
      login-epic 10-run campaign.
    classification: COMPATIBILITY_LEGACY
    detail: >-
      These are DWO M0-M4 era projections with no Universal G0->G6 Release-Kernel
      semantics and no TargetContract/RuntimePlan/ClosureReceipt/HandoffReceipt identity.
      They are legitimate compatibility inputs but must never be presented as native
      Universal projection state.
    disposition: Recorded in the capability inventory with source_profile=COMPATIBILITY; namespace-separated from native.

  - id: STALE-003
    severity: MEDIUM
    surface: projects/dw-observation (M0-M4 framing)
    classification: SUPERSEDED_TAXONOMY
    detail: >-
      Milestone framing M0-M4 is the DWO v1 delivery vocabulary. DWO v2 uses workstream
      WS0-WS8 and Universal G0->G6. The M0-M4 labels must not be emitted as DWO v2
      lifecycle or qualification state.
    disposition: Recorded as a superseded taxonomy in the inventory; new taxonomy introduced alongside it.

  - id: STALE-004
    severity: LOW
    surface: Python/TypeScript twin (dw_observation/*.py vs lib/*.ts)
    classification: PARITY_DEBT
    detail: >-
      Reducer/projection/replay/fixtures/adapters logic exists in both a Python package
      and a TypeScript lib with no enforced parity contract.
    disposition: >-
      Out of scope for this package. Recorded so SCRUM-823/824 make an explicit
      single-source-of-truth decision rather than extending both.

