kernel_contract_check_required:
  reason: >-
    The C4 digest reports an unresolved tension: the designated UR-DEV head 5c4e4a53 is a
    Draft M1 PR that defers executable runtime seams, while the Run Model page claims the
    20 design sections and 12 universal_run modules are IMPLEMENTED and ACCEPTED on
    gwc/main@d16d587e. Which kernel surfaces actually exist in the designated head must be
    proven, not assumed.
  method: >-
    Extract the kernel contract identity (gwc.universal-run/1, record envelope, receipt
    set, 35 failure codes) from 5c4e4a53 and from gwc/main, and diff them. The digest is
    machine-produced evidence attached to G3.
  blocking: true
  blocking_for: [G2_ACCEPTANCE]
  owner: "CR-821-A0 (new child run, ordered before CR-821-A)"

decomposition_revision_2:
  atomic: false
  child_runs:
    - id: CR-821-A0
      order: 0
      title: Kernel contract identity diff between designated UR-DEV head and gwc/main
      produces: [dwo-v2/baseline/kernel-contract-diff.json]
      blocking: true
      purpose: >-
        Prove which Universal Run Kernel surfaces exist in the bound head, so downstream
        projection/reducer packages do not target a surface that is not implemented.
    - id: CR-821-A
      order: 1
      title: Release-binding registry with fail-closed exact-SHA resolution
      produces: [lib/dwo/releaseBinding.ts, tests/unit/dwo/releaseBinding.test.ts]
      revised_requirement: >-
        The registry MUST encode the dual-source binding explicitly: UR-DEV native
        semantic source and GWC-MAIN compatibility source are separate fields and
        separate namespaces. A resolution failure of the UR-DEV source must fail closed
        and must never substitute gwc/main (ADR-11, AC-RB-02).
    - id: CR-821-B
      order: 2
      title: Drift classification taxonomy
      produces: [lib/dwo/drift.ts, tests/unit/dwo/drift.test.ts]
      revised_requirement: >-
        Canonical FNR-03 enum is exactly COMPATIBLE | ADAPTER_CHANGE | REDUCER_CHANGE |
        UI_CHANGE | QUALIFICATION_CHANGE | BLOCKING_CONTRACT_DRIFT. No numeric threshold.
    - id: CR-821-C
      order: 3
      title: Capability, compatibility and access-boundary inventories
      produces: [lib/dwo/inventory.ts, dwo-v2/baseline/capability-inventory.yaml, dwo-v2/baseline/access-boundary-inventory.yaml, tests/unit/dwo/inventory.test.ts]
      revised_requirement: >-
        The access-boundary inventory MUST use the five canonical trust boundaries from
        C4 §6, and MUST record that the write plane is not reachable from the DWO UI and
        that no browser-publishable credential exists for writes.
    - id: CR-821-D
      order: 4
      title: R0 rebind evidence record schema and DEV_BINDING_ACTIVE derivation
      produces: [lib/dwo/rebindRecord.ts, dwo-v2/baseline/r0-rebind-evidence.yaml, tests/unit/dwo/rebindRecord.test.ts]
      revised_requirement: >-
        binding_stage MUST use exactly RELEASE_DEV_TRACKING | MAIN_REBIND_PENDING |
        RELEASE_MAIN_BOUND (Roadmap §14.1 / C4 §21.2). The R0 exit token is
        DEV_BINDING_ACTIVE, which is the WS0 canonical token. V2_BASELINE_FROZEN and
        V2_RELEASE_REBOUND are legacy R0 table tokens and are NOT emitted.
  execution_order: [CR-821-A0, CR-821-A, CR-821-B, CR-821-C, CR-821-D]

authorized_paths_revision_2:
  - projects/dw-observation/lib/dwo/
  - projects/dw-observation/tests/unit/dwo/
  - projects/dw-observation/dwo-v2/baseline/
  - .gwc/tasks/SCRUM-821/

exit_token_resolution:
  r0_dev_exit: DEV_BINDING_ACTIVE
  rejected_tokens:
    - token: V2_BASELINE_FROZEN
      reason: legacy R0 table token; WS0 and SCRUM-821 both name DEV_BINDING_ACTIVE
    - token: V2_RELEASE_REBOUND
      reason: legacy post-merge token; RELEASE_MAIN_BOUND is canonical
  post_merge_token: RELEASE_MAIN_BOUND
  unresolved: >-
    The pages do not state which token is authoritative for the EPIC as a whole. This
    package emits DEV_BINDING_ACTIVE because SCRUM-821/WS0 name it explicitly, and
    records the divergence rather than blending tokens. Escalated as Q-003.

