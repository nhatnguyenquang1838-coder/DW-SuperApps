# G1 REPLAN RECORD — SCRUM-821 (DWO-V2-00)
# This is PLAN REVISION 2. It does NOT mutate revision 1.
# Revision 1 remains valid historical evidence at commit ff74ffc32bf22d907ccb59b2d0ce217ef230a258.

schema_version: '1.0'
artifact_type: replan-record
replan_operation: REPLAN_RUN
replan_reason_code: REPLAN_REQUIRED
replan_reason: >-
  The G1 plan bound the Universal Runtime release-development line by picking the
  most-recently-advanced Universal-contract branch. Canonical C4 solution design
  (3ea07c1c65b6813c95d6c7acf7a61c32 §0) explicitly designates a DIFFERENT line as the
  native semantic source. The R1 binding was therefore not the designated line, and
  continuing on it would have bound every downstream DWO v2 package to a source the
  canonical design does not designate.

supersedes:
  plan_ref: PLAN-821-R1
  plan_revision: 1
  plan_commit: ff74ffc32bf22d907ccb59b2d0ce217ef230a258
  historical_status: IMMUTABLE_HISTORY_RETAINED
  note: Revision 1 is retained, never deleted and never edited in place, per Universal
        Run Model §5.2 (run_id immutable; replan keeps the same run_id and creates a
        NEW immutable plan revision).

same_run_id_preserved: SCRUM-821
new_run_id_intentionally_not_created: true
new_run_id_rationale: >-
  REPLAN_RUN (not RESTART_AS_NEW_RUN) because the objective, target contract, scope
  boundary and acceptance criteria are unchanged. Only the source-binding identity
  changed. Creating a new run_id would discard valid G0/G1 evidence for no reason.

drift_classification: ADAPTER_CHANGE
drift_classification_justification: >-
  The change is a re-pointing of the native semantic source binding. It changes which
  adapter/profile the projection registry must key on, and it invalidates the R1
  exact_consumed_sha. It is NOT REDUCER_CHANGE or BLOCKING_CONTRACT_DRIFT because the
  Universal Run Kernel Contract Freeze (gwc.universal-run/1) is unchanged between the
  two heads, and the reducer contract is defined against the frozen kernel, not the
  moving branch. Confirming that claim requires the kernel-contract diff captured below
  as CR-821-A0 before G2 implementation is accepted.

