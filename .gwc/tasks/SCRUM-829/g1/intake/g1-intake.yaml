risks:
  - id: RISK-001
    description: Accessibility changes regress the existing 30-run semantic fixture baseline
    impact: HIGH
    mitigation: keep the hand-authored pack byte-identical; add a guard test asserting the 30-run catalog is unchanged
  - id: RISK-002
    description: Scale pack generation is non-deterministic, breaking qualification
    impact: MEDIUM
    mitigation: deterministic generator with fixed seed; assert reproducible output
  - id: RISK-003
    description: Budget thresholds are asserted rather than measured
    impact: MEDIUM
    mitigation: record measured values in the certification evidence, not hardcoded claims

