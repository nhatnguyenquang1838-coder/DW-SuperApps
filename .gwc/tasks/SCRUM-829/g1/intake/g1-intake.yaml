problem:
  statement: >-
    DWO v2 recursive-run UX must be accessible (keyboard-operable, ARIA-labeled,
    non-color-only status) and must behave predictably on large graphs via a
    generated scale pack and progressive-disclosure budget thresholds, without
    altering the hand-authored 30-run semantic fixture baseline.
  why_now: >-
    Accessibility and large-graph behavior are explicit DWO v2 qualification
    requirements (WS8). Without a generated scale pack and measured budget
    thresholds, large-graph performance and accessibility acceptance cannot be
    verified.

