problem:
  statement: >-
    DWO v2 has no run-centric product UX. SCRUM-827 (evidence inspector) and
    SCRUM-829 (accessibility) both depend on a usable Run List / Run Detail with
    recursive graph + accessible tree/list, UR lifecycle strip with UR-G* vs GWC-*
    namespace separation, authority/effect rail as evidence-only, and all 30 DEV
    FIXTURE runs rendered through the real reducer/view model.
  why_now: >-
    SCRUM-826 is the primary product surface. The reducer (SCRUM-824) and fixture
    stream (SCRUM-822) are now available. The UX must render all 30 fixtures through
    the real projection path, never a parallel UI source of truth.

