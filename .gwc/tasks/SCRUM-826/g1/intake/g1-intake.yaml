risks:
  - id: RISK-001
    description: Fixture-to-UI state bypass (parallel UI source of truth).
    impact: high
    mitigation: render all 30 fixtures through the real reducer/view model; no direct fixture-to-UI.
  - id: RISK-002
    description: Action affordance grants or consumes runtime authority.
    impact: high
    mitigation: authority/effect rail is evidence-only UX; no action grants/consumes authority.
  - id: RISK-003
    description: Graph and tree/list selection desynchronize.
    impact: high
    mitigation: single selection state shared by graph and tree/list.
  - id: RISK-004
    description: UR-G* vs GWC-* namespace conflation in lifecycle strip.
    impact: high
    mitigation: explicit namespace separation visible in the lifecycle strip.
  - id: RISK-005
    description: Scope creep into evidence inspector (SCRUM-827) or accessibility (SCRUM-829).
    impact: medium
    mitigation: authorized_paths enumerated; run-centric UX only.

