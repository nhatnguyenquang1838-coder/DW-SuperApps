objective: >-
  Define and implement the versioned DWO Projection Contract v2 and source/profile
  registry required for Universal Runtime observability, including the deterministic
  certification comparison contract (FNR-02) consumed by rebuild/replay/qualification.

scope:
  - recursive Run identity and Parent/Child relationships
  - UR-G* lifecycle namespace separated from GWC-* effect/governance namespace
  - RuntimePlan/topology/source provenance fields
  - target/handoff, authority/effect and recovery lineage representation
  - native Universal vs compatibility vs legacy profile registry
  - fail-closed UNKNOWN/INCOMPATIBLE behavior
  - explicit durable event position/order for deterministic prefix replay + gap detection
  - correlation/causation/trace metadata as evidence metadata only (never Run identity/authority)
  - explicit gap identity and versioned compatibility/upcast rules
  - FNR-02 deterministic certification comparison contract (versioned, cross-runtime vectors)

dependencies:
  - SCRUM-821 (DWO-V2-00) baseline inventory — DONE
  - SCRUM-822 (DWO-V2-01) fixture pack — DONE

constraints:
  - Contract is additive/versioned and preserves historical semantic integrity
  - Unsupported profiles never receive heuristic Universal semantics
  - FNR-02 comparison contract MUST NOT conflate lightweight UI digests with certification equality
  - Event position/order, gap identity, correlation/causation frozen before reducer/durable consumers finalize
  - no production write/effect path

