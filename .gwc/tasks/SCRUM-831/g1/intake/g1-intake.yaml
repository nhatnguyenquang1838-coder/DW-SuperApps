constraints:
  - MAIN_REBIND_PENDING entered only from durable release evidence
  - a moving branch name alone is not evidence
  - no silent collapse of historical development-source provenance
  - prior qualification whose subject materially drifted is not reused without fresh evidence
  - this task grants no merge/deploy/production authority
  - stage by explicit path; never git add .

target_contract:
  ref: TARGET-REBIND-831-R1
  revision: 1
  kind: STATE
  statement: >-
    A release-rebind mechanism exists that: detects the bound Universal release
    merge and resolves the exact released gwc/main SHA; enters MAIN_REBIND_PENDING
    only from durable release evidence; compares released main to the last qualified
    development source; classifies drift using the frozen taxonomy; records affected
    adapter/reducer/UI/qualification surfaces; rebinds the native semantic source to
    released main; reruns only the affected DEV-NATIVE qualification scope; and
    invalidates prior qualification on material subject drift. A warning guard
    enforces that DWO main may only be merged once the Universal release is merged.
    RELEASE_MAIN_BOUND is derivable from machine-readable state.
  validation:
    - all eight acceptance criteria covered by executed automated tests
    - DWO baseline stays green (typecheck, vitest, pytest)
    - RELEASE_MAIN_BOUND derivable from materialized state
  out_of_scope:
    - real-run certification (SCRUM-832)
    - any merge, deploy, production, migration or secret effect

