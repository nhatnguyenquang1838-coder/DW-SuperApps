    DWO v2 is bound to the Universal release-development line. SCRUM-831 must cut it
    over to the exact released gwc/main source with typed release evidence and
    affected-scope requalification. The external Universal release merge is not yet
    done (Q-001: PRs #582/#578/#574 all Draft). Per human decision, this is NOT a
    hard blocker for development — a warning guard (DWO main merge gated on
    Universal release merge) is enforced instead.
