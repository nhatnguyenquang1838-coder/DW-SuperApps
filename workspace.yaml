apiVersion: ai-workspace/v1
kind: Workspace

metadata:
  id: dw-superapps
  name: DW SuperApps

hosts:
  - kiro
  - codex
  - copilot
  - cline
  - kilo
  - claude
  - custom

orchestrators:
  - id: openclaw-acpx
    host: openclaw
    backend: acpx
    path: hosts/openclaw-acpx
    enabled: true
    workers:
      - codex
      - claude
      - kiro
      - kilocode

controllers:
  - id: taskcontroller
    enabled: true
    kind: workspace-controller
    registry: controllers/taskcontroller.yaml
    aliases:
      - TaskController
      - task controller
      - /dw-taskcontroller
    activation: explicit-mention

providers:
  - id: ollama
    type: openai-compatible
    base_url: http://localhost:11434/v1
    api_key: ollama
    model_env: OLLAMA_MODEL
    default_model: qwen3-coder:30b

distribution:
  ownership: workspace
  storeRoot: .dw/powers
  inboxRoot: .dw/inbox/powers
  cacheRoot: .dw/cache
  historyRoot: .dw/history/powers
  bindingsRoot: .dw/bindings
  hostAdaptersRoot: .

projects:
  - id: gwc
    path: projects/gwc
    source: nhatnguyenquang1838-coder/gwc
    roles:
      - power-source

  - id: ua
    path: projects/ua
    source: nhatnguyenquang1838-coder/Understand-Anything
    upstream: Egonex-AI/Understand-Anything
    roles:
      - power-source

  - id: task-me
    path: projects/task-me
    source: nhatnguyenquang1838-coder/task-me
    roles:
      - power-source

  - id: bmad
    path: projects/bmad
    source: nhatnguyenquang1838-coder/BMAD-METHOD
    roles:
      - power-source

  - id: dw-chatgpt-app
    path: projects/dw-chatgpt-app
    source: nhatnguyenquang1838-coder/dw-chatgpt-app
    roles:
      - tooling

  - id: rental-home
    path: projects/rental-home
    source: nhatnguyenquang1838-coder/rental_home
    roles:
      - product
    powers:
      enabled:
        - gwc
        - ua
        - task-me
        - bmad
    orchestration:
      primary: gwc
      workers:
        - task-me
        - bmad
        - ua
      hooks:
        - gate: g1
          intents:
            - task-decomposition
            - validation-planning
          worker: task-me
          output_into: g1-options
        - gate: g1
          intents:
            - architecture-design
            - data-modeling
          worker: bmad
          output_into: g1-options
        - gate: g1
          intents:
            - dependency-mapping
            - impact-analysis
          worker: ua
          output_into: g1-preflight

powers:
  - id: gwc
    project: gwc
    enabled: true
  - id: ua
    project: ua
    enabled: true
  - id: task-me
    project: task-me
    enabled: true
  - id: bmad
    project: bmad
    enabled: true

development:
  model: workspace-rooted-child-repository-worktrees
  projectAnchorRoot: projects
  worktreeRoot: worktrees
  worktreeTemplate: worktrees/{project}/{execution_unit}
  writableSurface: child-worktree-only
  canonicalRunbook: docs/runbooks/ISOLATED_SUBMODULE_WORKTREE.md
  controllerPolicy: controllers/executor-worktree-policy.md
  executionUnit:
    identity: repository-execution-unit
    oneWorktree: true
    oneBranch: true
    oneWriter: true
    agentIdentity: lease-or-binding-not-branch
  base:
    resolveRemoteBeforeCreate: true
    requireExactSha: true
  git:
    directDefaultBranchWrite: forbidden
    forcePush: forbidden
    sharedCommonStateMutation: controller-or-repository-admin-only
  integration:
    childRepositoryPr: required
    parentGitlinkPr: separate
    parentGitlinkMutation: explicit
    parentWriter: exclusive
  runtime:
    namespacePerExecutionUnit: true

data_ownership:
  policy: project-owned
  roots:
    ua: .ua
    task_me: .task-me
    gwc: .gwc
    bmad: .bmad
