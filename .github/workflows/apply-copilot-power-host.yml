name: Apply Copilot Power Host

on:
  push:
    branches:
      - feat/copilot-power-host

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/copilot-power-host

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply Copilot native Power host
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          class PatchError(RuntimeError):
              pass

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise PatchError(
                      f"{path}: expected exactly one replacement target, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def insert_once(path: Path, marker: str, insertion: str) -> None:
              text = path.read_text(encoding="utf-8")
              if insertion.strip() in text:
                  return
              count = text.count(marker)
              if count != 1:
                  raise PatchError(
                      f"{path}: expected exactly one insertion marker, found {count}"
                  )
              path.write_text(text.replace(marker, insertion + marker, 1), encoding="utf-8")

          cli = ROOT / "scripts" / "dw_cli.py"
          replace_once(
              cli,
              '''    "copilot": {
                  "kind": "instructions",
                  "file": ".github/instructions/dw-superapps.instructions.md",
              },''',
              '''    "copilot": {
                  "kind": "skills",
                  "root": ".github/skills",
                  "index": ".github/copilot-instructions.md",
              },''',
          )
          replace_once(
              cli,
              '''    prefix = ""
              if host == "copilot":
                  prefix = '---\\napplyTo: "**"\\n---\\n'
              if host == "claude":
                  prefix = "@AGENTS.md\\n\\n"''',
              '''    prefix = ""
              if host == "claude":
                  prefix = "@AGENTS.md\\n\\n"''',
          )
          replace_once(
              cli,
              '''def install_skill_host(host: str, mode: str) -> None:
              spec = HOST_SPECS[host]
              host_root = ROOT / spec["root"]''',
              '''def install_skill_host(host: str, mode: str) -> None:
              spec = HOST_SPECS[host]
              if host == "copilot":
                  legacy = ROOT / ".github/instructions/dw-superapps.instructions.md"
                  if legacy.exists() or legacy.is_symlink():
                      safe_remove_generated(legacy)
                      print(f"REMOVE: {legacy.relative_to(ROOT)}")
              host_root = ROOT / spec["root"]''',
          )

          tests = ROOT / "tests" / "test_multi_host_runtime.py"
          replace_once(
              tests,
              '''            "copilot": ".github/instructions",''',
              '''            "copilot": ".github/skills",''',
          )
          insert_once(
              tests,
              '''    def test_instruction_hosts_include_canonical_routing(self) -> None:
          ''',
              '''    def test_copilot_uses_native_skills_and_repository_index(self) -> None:
                  paths = {
                      path.relative_to(ROOT).as_posix()
                      for path in dw_cli.host_expected_paths("copilot")
                  }
                  expected_skills = {
                      f".github/skills/{power_id}/SKILL.md"
                      for power_id, manifest in dw_cli.manifests().items()
                      if "copilot" in manifest["spec"]["hosts"]
                  }
                  self.assertTrue(expected_skills)
                  self.assertTrue(expected_skills.issubset(paths))
                  self.assertIn(".github/copilot-instructions.md", paths)
                  self.assertNotIn(
                      ".github/instructions/dw-superapps.instructions.md",
                      paths,
                  )

          ''',
          )

          docs = ROOT / "docs" / "MULTI_HOST_SETUP.md"
          replace_once(
              docs,
              '''| GitHub Copilot | `.github/instructions/dw-superapps.instructions.md` |''',
              '''| GitHub Copilot | `.github/copilot-instructions.md` + `.github/skills/<power>/SKILL.md` |''',
          )
          replace_once(
              docs,
              '''dw host install kiro --mode wrapper
          dw host install codex --mode link
          dw host install claude --mode copy''',
              '''dw host install kiro --mode wrapper
          dw host install codex --mode link
          dw host install copilot --mode wrapper
          dw host install claude --mode copy''',
          )
          replace_once(
              docs,
              '''Open the DW-SuperApps repository root. Copilot loads `AGENTS.md` and the generated path-specific instructions.''',
              '''Open the DW-SuperApps repository root. Copilot loads `AGENTS.md`, `.github/copilot-instructions.md`, and the generated `.github/skills/<power>/SKILL.md` adapters.

          Copilot may select a Power automatically from its skill description. In supported Copilot surfaces, invoke one explicitly with `/dw-gwc`, `/dw-ua`, `/dw-task-me`, or `/dw-bmad`.''',
          )

          ignore = ROOT / ".gitignore"
          replace_once(
              ignore,
              '''.github/instructions/dw-superapps.instructions.md''',
              '''.github/skills/gwc/
          .github/skills/ua/
          .github/skills/task-me/
          .github/skills/bmad/
          .github/copilot-instructions.md
          # Legacy generated Copilot aggregate adapter
          .github/instructions/dw-superapps.instructions.md''',
          )
          PY

      - name: Generate and validate Copilot adapters
        shell: bash
        run: |
          python scripts/dw_cli.py host install copilot --mode wrapper
          python -m unittest tests.test_multi_host_runtime
          python scripts/dw_cli.py host status copilot

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-copilot-power-host.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(host): add native Copilot Power skills"
          git push origin HEAD:feat/copilot-power-host
