name: Diagnose Power compatibility patch once

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/remove-power-prompt-command'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-power-prompt-command
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Capture exact patch result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostics
          python - <<'PY' > .diagnostics/power-compatibility-apply.txt 2>&1 || true
          import base64
          import gzip
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/apply-power-compatibility-once.yml').read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['patch']['steps']
          encoded = next(step['env']['PATCH_GZIP_B64'] for step in steps if 'env' in step)
          script = Path('.diagnostics/apply_power_compatibility.py')
          script.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          result = subprocess.run(
              [sys.executable, str(script)], text=True, capture_output=True, check=False
          )
          print('returncode:', result.returncode)
          print('stdout:')
          print(result.stdout)
          print('stderr:')
          print(result.stderr)
          raise SystemExit(result.returncode)
          PY
          cat .diagnostics/power-compatibility-apply.txt

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-compatibility-apply-diagnostic
          path: .diagnostics/power-compatibility-apply.txt
          if-no-files-found: error
          retention-days: 2
