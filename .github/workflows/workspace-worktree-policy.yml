name: Workspace worktree policy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-worktree-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install policy dependencies
        run: python -m pip install PyYAML

      - name: Validate workspace worktree policy routing
        run: python scripts/validate_workspace_worktree_policy.py

      - name: Test workspace worktree policy
        run: python -m unittest -v tests.test_workspace_worktree_policy
