name: Validate workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.DW_SUBMODULE_TOKEN }}

      - name: Diagnose checkout
        if: failure()
        run: |
          echo "Submodule status:"
          git submodule status || true
          echo "Gitmodules:"
          cat .gitmodules || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Bash entrypoints
        shell: bash
        run: bash -n bin/dw scripts/install-dw.sh scripts/python-resolver.sh hosts/openclaw-acpx/install.sh

      - name: Install global DW CLI in temporary home
        shell: bash
        run: |
          rm -rf /tmp/dw-cli-home
          mkdir -p /tmp/dw-cli-home
          HOME=/tmp/dw-cli-home SHELL=/bin/bash bash bin/dw install --shell bash

      - name: Verify global DW CLI
        shell: bash
        run: |
          HOME=/tmp/dw-cli-home /tmp/dw-cli-home/.local/bin/dw --version
          grep -Fq "DW SuperApps CLI" /tmp/dw-cli-home/.bashrc

      - name: Uninstall global DW CLI
        shell: bash
        run: |
          HOME=/tmp/dw-cli-home SHELL=/bin/bash /tmp/dw-cli-home/.local/bin/dw uninstall --shell bash
          test ! -e /tmp/dw-cli-home/.local/bin/dw
          ! grep -Fq "DW SuperApps CLI" /tmp/dw-cli-home/.bashrc

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate workspace contract
        run: python scripts/dw_cli.py validate

      - name: Test one-click commands
        run: python -m unittest -v tests.test_oneclick_commands

      - name: Test multi-host runtime
        run: python -m unittest -v tests.test_multi_host_runtime

      - name: Test OpenClaw ACPX runtime
        run: python -m unittest -v tests.test_openclaw_acpx_runtime

      - name: Test Power Runtime v2
        run: python -m unittest -v tests.test_power_runtime_v2

      - name: Test distribution contract
        run: python -m unittest -v tests.test_power_distribution_contract

      - name: Test deterministic builder
        run: python -m unittest -v tests.test_power_dist_builder

      - name: Test distribution integration
        run: python -m unittest -v tests.test_power_distribution_integration

      - name: Test portable runtime installer
        run: python -m unittest -v tests.test_power_runtime_installer

      - name: Test package consumer
        run: python -m unittest -v tests.test_power_package_consumer

      - name: Test BMAD source lock and graph
        run: python -m unittest -v tests.test_bmad_power_plugin.BmadPowerPluginTests.test_source_lock_and_graph_use_same_commit

      - name: Test BMAD graph closure
        run: python -m unittest -v tests.test_bmad_power_plugin.BmadPowerPluginTests.test_knowledge_graph_references_are_closed

      - name: Test BMAD distribution recipe
        run: python -m unittest -v tests.test_bmad_power_plugin.BmadPowerPluginTests.test_distribution_recipe_is_valid_and_skills_only

      - name: Test BMAD Power manifest
        run: python -m unittest -v tests.test_bmad_power_plugin.BmadPowerPluginTests.test_power_manifest_validates

      - name: Test BMAD host mapping
        run: python -m unittest -v tests.test_bmad_power_plugin.BmadPowerPluginTests.test_bootstrap_host_mapping

      - name: Test BMAD deterministic package
        id: bmad_deterministic
        continue-on-error: true
        run: >-
          python -m unittest -v
          tests.test_bmad_power_plugin.BmadPowerPluginTests.test_external_source_overlay_builds_a_deterministic_package
          > bmad-deterministic.log 2>&1

      - name: Upload BMAD deterministic test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bmad-deterministic-test-log
          path: bmad-deterministic.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on BMAD deterministic test
        if: steps.bmad_deterministic.outcome == 'failure'
        run: |
          cat bmad-deterministic.log
          exit 1

      - name: Test BMAD workflow modes
        run: python -m unittest -v tests.test_bmad_power_plugin.BmadPowerPluginTests.test_workflow_has_manual_and_scheduled_modes

      - name: Validate all host adapters
        run: |
          python scripts/dw_cli.py host list
          python scripts/dw_cli.py host install all
          python scripts/dw_cli.py host status all

      - name: Validate Ollama provider profile
        run: |
          python scripts/dw_cli.py provider install all
          python scripts/dw_cli.py provider status all

      - name: Report submodule status
        run: python scripts/dw_cli.py power status all

  phase2_candidate:
    name: Build Phase 2 candidate
    needs: validate
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/projects-physical-migration'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_GWC: 62689ce35e279751a3bf17b5255ac258dafbe7d7
      EXPECTED_UA: 6ae71878beb50226a1e4b7e2f52ac6468c86f74b
      EXPECTED_TASK_ME: ef0b890b1fb9140109c04cbb490b41d9aa94bfff
      EXPECTED_RENTAL_HOME: 26b9ba643e5e216213489506daf5f2af2db09f1e
    steps:
      - name: Checkout exact PR head without submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.DW_SUBMODULE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact source pins
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git ls-tree HEAD powers/gwc | awk '{print $3}')" = "$EXPECTED_GWC"
          test "$(git ls-tree HEAD powers/ua | awk '{print $3}')" = "$EXPECTED_UA"
          test "$(git ls-tree HEAD powers/task-me | awk '{print $3}')" = "$EXPECTED_TASK_ME"
          test "$(git ls-tree HEAD systems/rental-home | awk '{print $3}')" = "$EXPECTED_RENTAL_HOME"

      - name: Move gitlinks in index
        shell: bash
        run: |
          set -euxo pipefail
          git rm --cached powers/gwc powers/ua powers/task-me systems/rental-home
          git update-index --add --cacheinfo 160000,"$EXPECTED_GWC",projects/gwc
          git update-index --add --cacheinfo 160000,"$EXPECTED_UA",projects/ua
          git update-index --add --cacheinfo 160000,"$EXPECTED_TASK_ME",projects/task-me
          git update-index --add --cacheinfo 160000,"$EXPECTED_RENTAL_HOME",projects/rental-home

      - name: Rewrite workspace metadata
        shell: bash
        run: |
          set -euxo pipefail
          cat > .gitmodules <<'EOF'
          [submodule "projects/gwc"]
          	path = projects/gwc
          	url = https://github.com/nhatnguyenquang1838-coder/gwc.git
          	branch = main
          [submodule "projects/ua"]
          	path = projects/ua
          	url = https://github.com/nhatnguyenquang1838-coder/Understand-Anything.git
          	branch = main
          [submodule "projects/task-me"]
          	path = projects/task-me
          	url = https://github.com/nhatnguyenquang1838-coder/task-me.git
          	branch = main
          [submodule "projects/rental-home"]
          	path = projects/rental-home
          	url = https://github.com/nhatnguyenquang1838-coder/rental_home.git
          	branch = main
          EOF
          python scripts/phase2_migrate_projects.py

      - name: Remove temporary migration machinery
        shell: bash
        run: |
          set -euxo pipefail
          git show origin/main:.github/workflows/validate-workspace.yml > .github/workflows/validate-workspace.yml
          git rm -f .github/workflows/phase2-capture-gitlinks.yml scripts/phase2_migrate_projects.py
          git add -A
          # Reinsert gitlinks after git add -A because the target submodule worktrees
          # are intentionally not checked out in this candidate builder.
          git update-index --add --cacheinfo 160000,"$EXPECTED_GWC",projects/gwc
          git update-index --add --cacheinfo 160000,"$EXPECTED_UA",projects/ua
          git update-index --add --cacheinfo 160000,"$EXPECTED_TASK_ME",projects/task-me
          git update-index --add --cacheinfo 160000,"$EXPECTED_RENTAL_HOME",projects/rental-home

      - name: Verify final candidate tree
        shell: bash
        run: |
          set -euxo pipefail
          git ls-files -s projects/gwc projects/ua projects/task-me projects/rental-home
          git ls-files -s powers/gwc powers/ua powers/task-me systems/rental-home
          test "$(git ls-files -s projects/gwc | awk '{print $2}')" = "$EXPECTED_GWC"
          test "$(git ls-files -s projects/ua | awk '{print $2}')" = "$EXPECTED_UA"
          test "$(git ls-files -s projects/task-me | awk '{print $2}')" = "$EXPECTED_TASK_ME"
          test "$(git ls-files -s projects/rental-home | awk '{print $2}')" = "$EXPECTED_RENTAL_HOME"
          test -z "$(git ls-files -s powers/gwc powers/ua powers/task-me systems/rental-home)"
          git diff --cached --stat

      - name: Validate candidate locally
        shell: bash
        run: |
          set -euxo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          python -m pip install -r requirements-dev.txt
          python scripts/dw_cli.py validate
          python -m unittest -v tests.test_project_registry tests.test_workspace_distribution_routing

      - name: Publish candidate branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(projects): move source gitlinks into projects"
          git push --force origin HEAD:refs/heads/phase2-migration-candidate
          echo "PHASE2_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "PHASE2_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
