name: Diagnose Power compatibility patch v2

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/remove-power-prompt-command'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-power-prompt-command
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Capture corrected patch result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostics
          python - <<'PY' > .diagnostics/power-compatibility-v2.txt 2>&1 || true
          import base64
          import gzip
          import subprocess
          import sys
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/apply-power-compatibility-once.yml').read_text())
          encoded = next(step['env']['PATCH_GZIP_B64'] for step in workflow['jobs']['patch']['steps'] if 'env' in step)
          script = gzip.decompress(base64.b64decode(encoded)).decode()
          old = '''for path in ("scripts/dw_cli.py", "scripts/dw_workspace_dist.py"):
              replace_once(
                  path,
                  '    package = store_root() / power_id\\n',
                  '    package = store_root() / power_id\\n'
                  '    guidance = package / "AGENT_GUIDANCE.md"\\n'
                  '    guidance_display = (\\n'
                  '        display_path(guidance)\\n'
                  '        if guidance.is_file()\\n'
                  '        else "legacy package: embedded activation contract"\\n'
                  '    )\\n',
              )
          '''
          new = '''for path in ("scripts/dw_cli.py", "scripts/dw_workspace_dist.py"):
              replace_once(
                  path,
                  '    metadata = manifest["metadata"]\\n'
                  '    spec = manifest["spec"]\\n'
                  '    package = store_root() / power_id\\n',
                  '    metadata = manifest["metadata"]\\n'
                  '    spec = manifest["spec"]\\n'
                  '    package = store_root() / power_id\\n'
                  '    guidance = package / "AGENT_GUIDANCE.md"\\n'
                  '    guidance_display = (\\n'
                  '        display_path(guidance)\\n'
                  '        if guidance.is_file()\\n'
                  '        else "legacy package: embedded activation contract"\\n'
                  '    )\\n',
              )
          '''
          if old not in script:
              raise SystemExit('correction marker not found')
          target = Path('.diagnostics/apply_v2.py')
          target.write_text(script.replace(old, new))
          result = subprocess.run([sys.executable, str(target)], text=True, capture_output=True)
          print('returncode:', result.returncode)
          print('stdout:')
          print(result.stdout)
          print('stderr:')
          print(result.stderr)
          raise SystemExit(result.returncode)
          PY
          cat .diagnostics/power-compatibility-v2.txt
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-compatibility-v2-diagnostic
          path: .diagnostics/power-compatibility-v2.txt
          if-no-files-found: error
          retention-days: 2
