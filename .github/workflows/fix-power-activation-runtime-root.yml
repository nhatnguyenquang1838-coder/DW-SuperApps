name: Fix Power activation runtime root

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/remove-power-prompt-command'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Preserve runtime-root routing
        run: python scripts/fix_power_activation_runtime_root.py
      - name: Validate focused runtime suite
        run: |
          python -m py_compile scripts/dw_cli.py scripts/dw_workspace_dist.py scripts/dw_dispatch.py
          python -m unittest -v \
            tests/test_power_prompt_removed.py \
            tests/test_workspace_distribution_routing.py \
            tests/test_multi_host_runtime.py \
            tests/test_power_runtime_v2.py
      - name: Commit clean fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): preserve Power runtime-root routing"
          git push origin HEAD:fix/remove-power-prompt-command
