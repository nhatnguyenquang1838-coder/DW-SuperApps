name: Apply and diagnose Power prompt removal v6

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/remove-power-prompt-command'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply patch and capture result
        id: patch
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          python scripts/remove_power_prompt_once_v5.py > .diagnostics/power-prompt-removal-v6.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat .diagnostics/power-prompt-removal-v6.txt
          exit 0

      - name: Validate focused behavior
        if: steps.patch.outputs.exit_code == '0'
        run: |
          python -m py_compile scripts/dw_cli.py scripts/dw_workspace_dist.py scripts/dw_dispatch.py
          python -m unittest -v tests/test_power_prompt_removed.py
          python -m unittest -v tests/test_workspace_distribution_routing.py

      - name: Commit clean patch
        if: steps.patch.outputs.exit_code == '0'
        shell: bash
        run: |
          rm -f .github/workflows/remove-power-prompt-diagnostic-v6.yml
          rm -rf .diagnostics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): remove Power prompt generation command"
          git push origin HEAD:fix/remove-power-prompt-command

      - name: Commit diagnostic on failure
        if: steps.patch.outputs.exit_code != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/power-prompt-removal-v6.txt
          git commit -m "chore: capture complete Power prompt removal failure"
          git push origin HEAD:fix/remove-power-prompt-command
          exit 1
