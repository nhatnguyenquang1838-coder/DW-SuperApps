name: Diagnose Power prompt removal

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'fix/remove-power-prompt-command'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run patch with captured output
        id: patch
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .diagnostics
          python scripts/remove_power_prompt_once_v3.py 2>&1 | tee .diagnostics/power-prompt-removal-error.txt

      - name: Commit diagnostic on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/power-prompt-removal-error.txt
          git commit -m "chore: capture Power prompt removal failure"
          git push origin HEAD:fix/remove-power-prompt-command
