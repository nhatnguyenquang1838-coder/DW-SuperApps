name: Apply Power compatibility validation once

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-power-compatibility-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/remove-power-prompt-command'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-power-prompt-command
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply exact compatibility patch
        shell: bash
        env:
          PATCH_GZIP_B64: ""
        run: |
          set -euo pipefail
          mkdir -p .diagnostics
          python - <<'PYCODE'
          import base64, gzip, os
          from pathlib import Path
          target = Path('.diagnostics/apply_power_compatibility.py')
          target.write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_B64'])))
          PYCODE
          python .diagnostics/apply_power_compatibility.py 2>&1 | tee .diagnostics/apply.log
      - name: Validate focused compatibility behavior
        shell: bash
        run: |
          set -euo pipefail
          {
            bash -n bin/dw
            python scripts/validate-workspace.py
            python scripts/validate-power-compatibility.py --strict
            python -m unittest -v tests.test_power_compatibility tests.test_power_dist_builder tests.test_power_runtime_installer tests.test_power_package_consumer tests.test_multi_host_runtime tests.test_power_prompt_removed tests.test_power_runtime_v2 tests.test_workspace_distribution_routing
          } 2>&1 | tee .diagnostics/validation.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-compatibility-final-diagnostic
          path: .diagnostics/*.log
          if-no-files-found: warn
          retention-days: 2
      - name: Commit clean source patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .diagnostics
          rm -f .github/workflows/apply-power-compatibility-once.yml .github/workflows/diagnose-power-compatibility-once.yml .github/workflows/apply-power-compatibility-v2.yml .github/workflows/diagnose-power-compatibility-v2.yml .github/workflows/apply-power-compatibility-v3.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(runtime): validate current Power compatibility'
          git push origin HEAD:fix/remove-power-prompt-command
