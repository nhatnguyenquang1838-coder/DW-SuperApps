name: Apply Power compatibility validation once

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - .github/workflows/apply-power-compatibility-once.yml
      - .github/patches/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-power-compatibility-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/remove-power-prompt-command'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-power-prompt-command
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostics
          cat .github/patches/power-compatibility-*.b64 | tr -d '\n\r ' > "$RUNNER_TEMP/power-compatibility.b64"
          test "$(wc -c < "$RUNNER_TEMP/power-compatibility.b64")" -eq 13488
          echo 'adba8545598f2a5cf1b12d194ab2a060553c53115ecbd9f0aa359d12badc4f81  '"$RUNNER_TEMP/power-compatibility.b64" | sha256sum -c -
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          encoded = Path(os.environ['RUNNER_TEMP'], 'power-compatibility.b64').read_text()
          target = Path(os.environ['RUNNER_TEMP'], 'apply_power_compatibility.py')
          target.write_bytes(gzip.decompress(base64.b64decode(encoded, validate=True)))
          PY
          echo 'b67d6ed746ef760e0bf037ab555e4e0a4b4ef28600c7feb43c3091d18d83767e  '"$RUNNER_TEMP/apply_power_compatibility.py" | sha256sum -c -
          python - <<'PY'
          import os
          from pathlib import Path

          target = Path(os.environ['RUNNER_TEMP'], 'apply_power_compatibility.py')
          text = target.read_text(encoding='utf-8')
          old = "'dw power doctor <power-id> --target <system-path>\\n'"
          new = "'dw power doctor task-me --target projects/rental-home\\n'"
          if text.count(old) != 2:
              raise SystemExit(f'documentation marker count mismatch: {text.count(old)}')
          target.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply compatibility patch
        shell: bash
        run: python "$RUNNER_TEMP/apply_power_compatibility.py"

      - name: Validate focused compatibility behavior
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/dw
          python scripts/validate-workspace.py
          python scripts/validate-power-compatibility.py --strict
          python -m unittest -v \
            tests.test_power_compatibility \
            tests.test_power_dist_builder \
            tests.test_power_runtime_installer \
            tests.test_power_package_consumer \
            tests.test_multi_host_runtime \
            tests.test_power_prompt_removed \
            tests.test_power_runtime_v2 \
            tests.test_workspace_distribution_routing

      - name: Commit runtime and contract changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .diagnostics
          git restore --source=HEAD -- .github/workflows/validate-workspace.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(runtime): validate current Power compatibility'
          git push origin HEAD:fix/remove-power-prompt-command
