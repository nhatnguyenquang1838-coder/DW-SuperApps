name: Diagnose Power Runtime v2

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'fix/remove-power-prompt-command'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Capture focused test
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          python -m unittest -v tests/test_power_runtime_v2.py > .diagnostics/power-runtime-v2.txt 2>&1
          cat .diagnostics/power-runtime-v2.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/power-runtime-v2.txt
          git commit -m "chore: capture Power Runtime v2 test output"
          git push origin HEAD:fix/remove-power-prompt-command
