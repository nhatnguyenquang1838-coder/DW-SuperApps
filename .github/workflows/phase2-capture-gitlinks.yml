name: Phase 2 capture gitlinks

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2-capture-gitlinks.yml
      - .gitmodules
      - workspace.yaml
      - projects/**
      - powers/**
      - systems/**

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture exact head tree and gitlinks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/git/trees/${HEAD_SHA}?recursive=1"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > tree.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("tree.json").read_text(encoding="utf-8"))
          required = [
              "powers/gwc",
              "powers/ua",
              "powers/task-me",
              "systems/rental-home",
          ]
          entries = {item["path"]: item for item in payload.get("tree", [])}
          gitlinks = {}
          for path in required:
              item = entries.get(path)
              if not item or item.get("mode") != "160000" or item.get("type") != "commit":
                  raise SystemExit(f"missing gitlink: {path}")
              gitlinks[path] = item["sha"]
          evidence = {
              "head": os.environ["HEAD_SHA"],
              "tree": payload["sha"],
              "gitlinks": gitlinks,
          }
          text = json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          Path("phase2-gitlinks.json").write_text(text, encoding="utf-8")
          print("PHASE2_GITLINK_EVIDENCE=" + json.dumps(evidence, sort_keys=True))
          PY
      - name: Upload exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-gitlinks-${{ github.event.pull_request.head.sha }}
          path: phase2-gitlinks.json
          if-no-files-found: error
          retention-days: 7
