name: Phase 2 coupling report

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2-capture-gitlinks.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Report exact tree, gitlinks, and coupled files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          head = os.environ['HEAD_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def api(path):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}', headers=headers
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          commit = api(f'git/commits/{head}')
          tree_sha = commit['tree']['sha']
          tree = api(f'git/trees/{tree_sha}?recursive=1')['tree']
          entries = {item['path']: item for item in tree}
          legacy = [
              'powers/gwc', 'powers/ua', 'powers/task-me', 'systems/rental-home'
          ]
          pins = {path: entries[path]['sha'] for path in legacy}
          patterns = legacy + ['Egonex-AI/Understand-Anything']
          coupled = []
          for item in tree:
              if item.get('type') != 'blob' or item.get('size', 0) > 1000000:
                  continue
              path = item['path']
              blob = api(f"git/blobs/{item['sha']}")
              try:
                  text = base64.b64decode(blob['content']).decode('utf-8')
              except (UnicodeDecodeError, ValueError):
                  continue
              found = sorted(pattern for pattern in patterns if pattern in text)
              if found:
                  coupled.append({'path': path, 'patterns': found})
          evidence = {
              'head': head,
              'tree': tree_sha,
              'gitlinks': pins,
              'coupled_files': coupled,
          }
          print('PHASE2_REPORT=' + json.dumps(evidence, sort_keys=True))
          PY
