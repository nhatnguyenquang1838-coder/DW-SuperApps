apiVersion: dw-superapps/controller/v1
kind: WorkspaceController

metadata:
  id: taskcontroller
  name: TaskController
  status: active-a2a-runtime

activation:
  mode: explicit-mention
  aliases:
    - TaskController
    - task controller
    - /dw-taskcontroller
  case_sensitive: false
  memory_fallback_allowed: false
  missing_required_entrypoint: BLOCKED

classification:
  power: false
  workspace_controller: true
  purpose: >-
    Control and monitor bounded delegated Executor runs with deterministic
    TaskController state, reference-based Agent interaction, durable audit
    evidence, crash-safe continuation checkpoints, and a Slack human
    control/visibility plane.

canonical_load_order:
  - AGENTS.md
  - workspace.yaml
  - controllers/taskcontroller.yaml
  - agents/README.md

host_overlays:
  chatgpt:
    required:
      - agents/chatgpt-agent/agent-instructions.md
    interaction:
      required:
        - agents/shared/taskcontroller-a2a-protocol.md
    human_plane:
      required:
        - agents/shared/taskcontroller-human-plane-policy.md
    slack_human_plane:
      required:
        - agents/chatgpt-agent/slack-controller-mvp.md
  hermes:
    executor:
      required:
        - agents/shared/taskcontroller-a2a-protocol.md
        - controllers/executor-worktree-policy.md
        - agents/hermes/agent-instructions.md

interaction:
  protocol: dw.taskcontroller.a2a/v1
  pilot_binding: github-reference-mailbox
  one_actor_one_mutable_mailbox: true
  context_by_reference: true
  mailbox_boot:
    required_when_active: true
    before_first_dispatch: true
    controller_mailbox_required: true
    executor_mailbox_required: true
    continuation_required: true
    exact_readback_required: true
    machine_progress_transport: github-reference-mailbox
    slack_machine_transport_fallback: forbidden
    missing_behavior: TASKCONTROLLER_MAILBOX_NOT_MATERIALIZED
  bounded_context:
    request_chars_max: 4096
    state_utf8_bytes_max: 8192
    input_refs_max: 16
    artifact_refs_max: 16
  canonical_ids_from_binding_ids: forbidden
  notification:
    protocol: dw.taskcontroller.wakeup/v1
    optional_when_executor_does_not_poll: true
    pilot_binding: slack-wakeup
    pointer_only: true
    command_payload_forbidden: true
    progress_payload_forbidden: true
    canonical_ids_from_notification_ids: forbidden
    provider_requirements:
      hermes-cloud:
        wakeup_binding: slack-websocket
        required: true
  future_bindings:
    - a2a-http
    - local-ipc
    - nats
    - kafka-msk

human_plane:
  canonical_policy: agents/shared/taskcontroller-human-plane-policy.md
  policy_source: current-repository-state
  external_policy_sources: forbidden
  human_control_plane: slack
  connector_required_when_active: true
  topology:
    controller_count: 1
    executor_count: 1
    rootcard_count: 1
    thread_count: 1
  root_semantics: live-human-snapshot
  thread_semantics: semantic-human-timeline
  machine_progress_transport: false
  slack_reply_rendering:
    preferred_surface: block_kit
    text_format: mrkdwn
    plain_text_fallback_required: true
    thread_reply_only: true
    duplicate_progress_suppressed: true
  polling:
    mailbox_mode: in-session-incremental
    cadence_seconds: 60
    cadence_policy: progressive-backoff-on-unchanged-mailbox-seq
    adaptive_cadence_seconds:
      - 60
      - 120
      - 180
    cadence_reset_on_new_seq: true
    cadence_max_seconds: 180
    in_session_sleep_required: true
    silent: true
    exact_mailbox_comment_only: true
    detached_scheduler_allowed: false
  verdicts:
    - CONTINUE
    - WAIT_CONTROLLER
    - TERMINAL
    - INTERCEPT

audit:
  canonical_persistence: taskcontroller/audit/sqlite_writer.py
  facade: taskcontroller/audit/facade.py
  semantic_agent_events_recorded: true
  continuation_manifest_kind: dw.taskcontroller.continuation/v1
  chain_of_thought_recorded: false
  slack_is_audit_storage: false

resilience:
  continuation_checkpoint: required-before-dispatch
  active_run_semantic_final: forbidden
  continuation_module: taskcontroller/interaction/continuation.py
  runtime_session: taskcontroller/runtime/session.py
  durable_pilot_copy:
    controller_mailbox_state: required
    audit_manifest: required-when-audit-configured
  pre_dispatch_order:
    - materialize-controller-mailbox
    - materialize-executor-mailbox
    - persist-continuation
    - write-controller-mailbox-with-checkpoint
    - exact-mailbox-readback
    - wake-executor-pointer-only
  recovery_inputs:
    - current-repository-and-run-identity
    - controller-mailbox-checkpoint
    - executor-mailbox-cursor
    - exact-pr-sha-ci-artifact-refs
    - audit-continuation-manifest-when-configured
    - slack-rootcard-binding-for-human-continuity
  conversation_history_required: false
  slack_thread_history_required: false

mvp:
  protocol_bridge: taskcontroller/mvp/protocol_bridge.py
  activation_resolver: taskcontroller/mvp/activation.py
  interaction_module: taskcontroller/interaction
  continuation_checkpoint: taskcontroller/interaction/continuation.py
  runtime_session: taskcontroller/runtime/session.py
  full_e2e_runtime: active
  legacy_slack_pilot: compatibility-only
  explicitly_deferred:
    - SlackTaskControllerPack
    - LeaseManager
    - EventRouter
    - multi-executor-routing

execution_contract:
  subtask_count_min: 3
  subtask_count_max: 5
  local_repository_mutation_policy: controllers/executor-worktree-policy.md
  required_subtask_fields:
    - ID
    - Objective
    - Allowed work
    - Expected output
    - Report requirement
    - After report
  executor_must_not_invent_plan: true
  controller_owns:
    - decomposition
    - selected-plan contracting
    - milestone timing
    - report requirements
    - WAIT_CONTROLLER boundaries
    - RootCard state
    - mailbox observation
    - continuation checkpoint
    - wakeup notification when required
    - report review
    - bounded INTERCEPT
  local_child_repository_binding:
    workspace_root: DW-SuperApps
    writable_surface: worktrees/<project>/<execution-unit>
    project_anchor: projects/<project>
    one_writer_per_execution_unit: true
    exact_remote_base_sha_required: true
    parent_gitlink_integration: explicit-and-exclusive
    runtime_namespace_per_execution_unit: true

integrity:
  source_of_truth: current-repository-state
  conversation_memory_authoritative: false
  slack_authoritative: false
  human_plane_policy_authority: agents/shared/taskcontroller-human-plane-policy.md
  external_human_plane_policy_sources: forbidden
  github_mailbox_authority: communication-binding-and-pilot-continuation-copy
  notification_binding_authority: wakeup-only
  audit_ledger_authoritative_for_recorded-events-and-configured-continuation-manifest: true
  self_modify_agent_instructions_without_explicit_scope: forbidden
