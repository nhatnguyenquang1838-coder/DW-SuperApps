apiVersion: dw-superapps/controller/v1
kind: WorkspaceController

metadata:
  id: taskcontroller
  name: TaskController
  status: active-a2a-runtime

activation:
  mode: explicit-mention
  aliases:
    - TaskController
    - task controller
    - /dw-taskcontroller
  case_sensitive: false
  memory_fallback_allowed: false
  missing_required_entrypoint: BLOCKED

classification:
  power: false
  workspace_controller: true
  purpose: >-
    Control and monitor bounded delegated Executor runs with deterministic
    TaskController state, reference-based Agent interaction, durable audit
    evidence, crash-safe continuation checkpoints, and a Slack human
    control/visibility plane.

canonical_load_order:
  - AGENTS.md
  - workspace.yaml
  - controllers/taskcontroller.yaml
  - agents/README.md

host_overlays:
  chatgpt:
    required:
      - agents/chatgpt-agent/agent-instructions.md
    interaction:
      required:
        - agents/shared/taskcontroller-a2a-protocol.md
    human_plane:
      required:
        - agents/shared/taskcontroller-human-plane-policy.md
    slack_human_plane:
      required:
        - agents/chatgpt-agent/slack-controller-mvp.md
  hermes:
    executor:
      required:
        - agents/shared/taskcontroller-a2a-protocol.md
        - controllers/executor-worktree-policy.md
        - agents/hermes/agent-instructions.md

interaction:
  protocol: dw.taskcontroller.mailbox/v2
  compatibility_protocol: dw.taskcontroller.a2a/v1
  compatibility_status: explicit-opt-in-only
  high_integrity_protocol: dw.taskcontroller.mailbox/v2
  high_integrity_admission:
    required_when:
      - external-governance-or-gate-contract-active
      - human-approval-or-effect-authority-required
      - digest-bound-execution-identity-required
    admission_guard: taskcontroller/controlplane/controller_admission.py
    repository_adapter: taskcontroller/interaction/github_mailbox_v2.py
    repository_adapter_class: GitHubMailboxRepository
    remote_record_protocol: dw.taskcontroller.github-mailbox-record/v1
    continuation_store: taskcontroller/interaction/github_continuation_store.py
    continuation_store_class: GitHubContinuationStore
    continuation_record_protocol: dw.taskcontroller.github-continuation-record/v1
    mailbox_record_model: append-only-github-issue-comments
    one_writer_per_actor_mailbox: true
    cross_process_multi_writer_cas: unsupported
    mailbox_read_scope: exact-mailbox-ref
    machine_state_integrity: canonical-envelope-digest
    raw_mutable_comment_body_sha: forbidden-as-authority
    issue_wide_machine_state_scan: forbidden
    schema_resolution: descriptor-bound
    expected_digest_source: observed-or-canonical-recompute
    target_gate_bootstrap_before_authority: forbidden
    approval_presentation_binding: typed-artifact-command-digest
    authority_granted: false
    missing_behavior: TASKCONTROLLER_HIGH_INTEGRITY_ADMISSION_BLOCKED
    materializer: taskcontroller/runtime/high_integrity_session.py
    materializer_function: materialize_controller_transition
    hand_authored_machine_records: forbidden
    runtime_owned_record_types:
      - event
      - cursor
  canonical_binding: github-mailbox-v2
  compatibility_binding: github-reference-mailbox-v1
  v1_one_actor_one_mutable_mailbox: compatibility-only
  v1_default_activation: forbidden
  context_by_reference: true
  mailbox_boot:
    required_when_active: true
    before_first_dispatch: true
    controller_mailbox_required: true
    executor_mailbox_required: true
    continuation_required: true
    exact_readback_required: true
    machine_progress_transport: github-mailbox-v2
    slack_machine_transport_fallback: forbidden
    missing_behavior: TASKCONTROLLER_MAILBOX_NOT_MATERIALIZED
  bounded_context:
    request_chars_max: 4096
    state_utf8_bytes_max: 8192
    input_refs_max: 16
    artifact_refs_max: 16
  canonical_ids_from_binding_ids: forbidden
  notification:
    protocol: dw.taskcontroller.wakeup/v1
    optional_when_executor_does_not_poll: true
    pilot_binding: slack-wakeup
    pointer_only: true
    command_payload_forbidden: true
    progress_payload_forbidden: true
    canonical_ids_from_notification_ids: forbidden
    provider_requirements:
      hermes-cloud:
        wakeup_binding: slack-websocket
        required: true
  future_bindings:
    - a2a-http
    - local-ipc
    - nats
    - kafka-msk

human_plane:
  canonical_policy: agents/shared/taskcontroller-human-plane-policy.md
  policy_source: current-repository-state
  external_policy_sources: forbidden
  human_control_plane: slack
  connector_required_when_active: true
  topology:
    controller_count: 1
    executor_count: 1
    rootcard_count: 1
    thread_count: 1
  root_semantics: live-human-snapshot
  thread_semantics: semantic-human-timeline
  machine_progress_transport: false
  slack_reply_rendering:
    preferred_surface: block_kit
    text_format: mrkdwn
    plain_text_fallback_required: true
    thread_reply_only: true
    duplicate_progress_suppressed: true
  polling:
    mailbox_mode: in-session-incremental
    cadence_seconds: 60
    cadence_policy: progressive-backoff-on-unchanged-mailbox-seq
    adaptive_cadence_seconds:
      - 60
      - 120
      - 180
    cadence_reset_on_new_seq: true
    cadence_max_seconds: 180
    in_session_sleep_required: true
    silent: true
    exact_mailbox_comment_only: true
    detached_scheduler_allowed: false
  verdicts:
    - CONTINUE
    - WAIT_CONTROLLER
    - TERMINAL
    - INTERCEPT

audit:
  canonical_persistence: taskcontroller/audit/sqlite_writer.py
  facade: taskcontroller/audit/facade.py
  semantic_agent_events_recorded: true
  continuation_manifest_kind: dw.taskcontroller.continuation/v1
  chain_of_thought_recorded: false
  slack_is_audit_storage: false

resilience:
  continuation_checkpoint: required-before-dispatch
  active_run_semantic_final: forbidden
  continuation_module: taskcontroller/interaction/continuation.py
  runtime_session: taskcontroller/runtime/high_integrity_session.py
  compatibility_runtime_session: taskcontroller/runtime/session.py
  v1_runtime_status: compatibility-only
  v2_materializer_required: true
  manual_machine_json: forbidden
  durable_pilot_copy:
    controller_mailbox_state: required
    high_integrity_remote_continuation: required
    audit_manifest: required-when-audit-configured
  pre_dispatch_order:
    - materialize-controller-mailbox
    - materialize-executor-mailbox
    - validate-semantic-transition
    - persist-continuation
    - compile-mailbox-v2-envelope
    - prepare-dispatch-ledger
    - append-controller-mailbox-event
    - exact-mailbox-readback
    - acknowledge-controller-cursor
    - exact-continuation-readback
    - wake-executor-pointer-only
  recovery_inputs:
    - current-repository-and-run-identity
    - controller-mailbox-checkpoint
    - executor-mailbox-cursor
    - exact-pr-sha-ci-artifact-refs
    - audit-continuation-manifest-when-configured
    - slack-rootcard-binding-for-human-continuity
  conversation_history_required: false
  slack_thread_history_required: false

mvp:
  protocol_bridge: taskcontroller/mvp/protocol_bridge.py
  activation_resolver: taskcontroller/mvp/activation.py
  interaction_module: taskcontroller/interaction
  continuation_checkpoint: taskcontroller/interaction/continuation.py
  runtime_session: taskcontroller/runtime/session.py
  full_e2e_runtime: active
  legacy_slack_pilot: compatibility-only
  explicitly_deferred:
    - SlackTaskControllerPack
    - LeaseManager
    - EventRouter
    - multi-executor-routing

execution_contract:
  contracting_guard: taskcontroller/controlplane/execution_contracting.py
  required_mode_for_new_high_integrity_requests: true
  modes:
    PLAN:
      writable_scope: forbidden
      execution_authority_active: false
      purpose: research-design-decompose-validate
    TRANSPORT_REPAIR:
      writable_scope: mailbox-transport-only
      execution_authority_active: false
      purpose: protocol-or-transport-correction
    EXECUTE:
      execution_authority_active: required
      execution_plan_ref: required
      approval_ref: required
      approval_digest: required
      writable_targets: required
      real_engineering_action: required
      work_packages: required
      continue_until: required
      stop_conditions: hard-boundaries-only
      executor_owns_implementation_details_inside_scope: true
      routine_engineering_wait_points: forbidden
      allowed_package_actions_when_approved:
        - create_guarded_branch_or_worktree
        - modify_approved_files
        - run_sandboxed_validation
        - stage
        - create_commit
        - push_working_branch
        - open_or_update_draft_pr
      separate_authority_required:
        - mark_pr_ready_for_review
        - merge_approved_pr
        - deploy_approved_release
        - production_config_change
        - production_data_write
        - migration
        - credential_rotation
        - branch_deletion
        - force_push
  routine_engineering_conditions_not_wait_boundaries:
    - RED_COMPLETE
    - GREEN_COMPLETE
    - TEST_FAILURE
    - LINT_FAILURE
    - REFACTOR_NEEDED
    - ROUTINE_IMPLEMENTATION_DECISION
  default_after_execution_authority: continue-working-within-approved-boundary
  controller_owned_hitl:
    user_to_executor_direct_approval: forbidden
    executor_wait_user_semantics: forbidden
    authority_boundary_report_target: controller-only
    controller_materializes_human_request: required
    wait_without_actionable_human_or_delegate_request: forbidden
    unrouted_authority_failure: AUTHORITY_REQUEST_UNROUTED
  executor_boundary_policy:
    canonical_blocker_classes:
      - AUTHORITY_BOUNDARY
      - SCOPE_EXPANSION
      - MATERIAL_PLAN_INVALIDATION
      - EXTERNAL_DEPENDENCY_BLOCKED
    routine_progress_requires_release: false
    execution_progress_resume: first-class
    atomic_max_children_zero_terminal: supported
  hold_semantics:
    ambiguous_hold: forbidden
    EFFECT_HOLD:
      control_loop_continues: true
      effect_scope_must_be_explicit: true
    RUN_HOLD:
      control_loop_continues: false
      fresh_user_release_required: true
  mission_semantics:
    work_packages_are_internal_execution_stages: true
    work_package_completion_is_authority_boundary: false
    one_approved_execute_contract_runs_to_ceiling: true
    executor_reports_completion_or_one_canonical_blocker: true
  subtask_count_min: 3
  subtask_count_max: 5
  local_repository_mutation_policy: controllers/executor-worktree-policy.md
  required_subtask_fields:
    - ID
    - Objective
    - Allowed work
    - Expected output
    - Report requirement
    - After report
  executor_must_not_invent_plan: true
  controller_owns:
    - decomposition
    - selected-plan contracting
    - milestone timing
    - report requirements
    - WAIT_CONTROLLER boundaries
    - RootCard state
    - mailbox observation
    - continuation checkpoint
    - wakeup notification when required
    - report review
    - bounded INTERCEPT
  local_child_repository_binding:
    workspace_root: DW-SuperApps
    writable_surface: worktrees/<project>/<execution-unit>
    project_anchor: projects/<project>
    one_writer_per_execution_unit: true
    exact_remote_base_sha_required: true
    parent_gitlink_integration: explicit-and-exclusive
    runtime_namespace_per_execution_unit: true

integrity:
  source_of_truth: current-repository-state
  conversation_memory_authoritative: false
  slack_authoritative: false
  human_plane_policy_authority: agents/shared/taskcontroller-human-plane-policy.md
  external_human_plane_policy_sources: forbidden
  github_mailbox_authority: communication-binding-and-pilot-continuation-copy
  notification_binding_authority: wakeup-only
  audit_ledger_authoritative_for_recorded-events-and-configured-continuation-manifest: true
  executor_self_maintenance:
    own_runtime_skills: allowed
    own_agent_instructions: allowed
    scope: executor-local
    must_not_expand_authority: true
    must_not_change_controller_contract: true
    must_not_override_canonical_repository_policy: true
  protected_self_modification:
    taskcontroller_governance: forbidden_without_explicit_scope
    approval_authority: forbidden_without_explicit_scope
    human_plane_policy: forbidden_without_explicit_scope
    project_governance: forbidden_without_explicit_scope
