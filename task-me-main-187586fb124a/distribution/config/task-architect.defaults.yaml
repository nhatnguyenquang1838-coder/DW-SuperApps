schemaVersion: "1.0"
folderMode: per_task
repositoryRoot: .
knowledgeRoot: .ua
outputRoot: .ua/generated/task-plans
runtimeRoot: .task-me
inputs:
  requirements: []
  designs: []
  systemGraphs: []
  sourceRoots: []
  testRoots: []
output:
  taskFolderPattern: "tasks/{task_id}-{slug}"
  taskFiles:
    - task.yaml
    - README.md
    - impact-analysis.md
    - implementation-plan.md
    - coding-guide.md
    - test-plan.md
    - evidence.json
    - decisions.md
notes:
  - Copy and adapt this file into the consumer-owned configuration location.
  - Installation does not create tasks, plans, branches, issues, or pull requests.
