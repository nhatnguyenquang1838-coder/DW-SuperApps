apiVersion: ai-workspace/v1
kind: Workspace
metadata:
  id: __WORKSPACE_ID__
  name: "__WORKSPACE_NAME__"
hosts:
  - kiro
  - codex
  - copilot
  - cline
  - kilo
  - claude
  - custom
providers:
  - id: ollama
    type: openai-compatible
    base_url: http://localhost:11434/v1
    api_key: ollama
    model_env: OLLAMA_MODEL
    default_model: qwen3-coder:30b
distribution:
  ownership: workspace
  storeRoot: .dw/powers
  inboxRoot: .dw/inbox/powers
  cacheRoot: .dw/cache
  historyRoot: .dw/history/powers
  bindingsRoot: .dw/bindings
  hostAdaptersRoot: .
projects: []
powers: []
data_ownership:
  policy: project-owned
  roots:
    ua: .ua
    task_me: .task-me
    gwc: .gwc
    bmad: .bmad
